name: Tests

on:
  push:
    branches: [main]
    paths-ignore: [docs/**]
  pull_request:
    paths-ignore: [docs/**]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer test
